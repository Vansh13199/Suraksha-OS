; ============================================================================
; Suraksha+ Watch OS — PlatformIO Configuration
; Target: Seeed XIAO ESP32S3
; Display: SH1106 128x64 OLED (I2C)
; ============================================================================

[env:xiao_esp32s3]
platform = espressif32@^6.4.0
board = seeed_xiao_esp32s3
framework = arduino

; --- Build Flags ---
build_flags =
    ; PSRAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; General
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Partition Scheme (8MB Flash) ---
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; --- Dependencies ---
lib_deps =
    ; Display (SH1106 128x64 OLED via I2C)
    olikraus/U8g2@^2.35.9

    ; Sensors
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

    ; Touch — REMOVED (SH1106 OLED has no touch)
    ; LVGL — REMOVED (using U8g2 for monochrome OLED)
    ; TFT_eSPI — REMOVED (not using SPI TFT)

; --- Upload/Monitor ---
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; --- Build Optimization ---
build_type = release
board_build.f_cpu = 240000000L
