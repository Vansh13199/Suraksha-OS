; ============================================================================
; Suraksha+ Watch OS — PlatformIO Configuration
; Target: Seeed XIAO ESP32S3
; ============================================================================

[env:xiao_esp32s3]
platform = espressif32@^6.4.0
board = seeed_xiao_esp32s3
framework = arduino

; --- Build Flags ---
build_flags =
    ; PSRAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; LVGL Configuration
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_TICK_CUSTOM=1

    ; TFT_eSPI Configuration (GC9A01 Round Display 240x240)
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_CS=1
    -DTFT_DC=2
    -DTFT_RST=3
    -DTFT_BL=6
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DSUPPORT_TRANSACTIONS

    ; General
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Partition Scheme (8MB Flash) ---
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; --- Dependencies ---
lib_deps =
    ; Display
    bodmer/TFT_eSPI@^2.5.34
    lvgl/lvgl@^8.3.11

    ; Sensors
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

    ; Touch (CST816S for Seeed Round Display)
    ; Using custom driver — no external lib needed

    ; Storage
    ; Preferences is built into ESP32 Arduino core

; --- Upload/Monitor ---
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; --- Build Optimization ---
build_type = release
board_build.f_cpu = 240000000L
