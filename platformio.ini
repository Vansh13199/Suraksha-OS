; ============================================================================
; Suraksha+ Watch OS — PlatformIO Configuration
; ============================================================================
; Two targets:
;   1. lilygo_twatch_s3  — Main watch (LilyGo T-Watch S3, ESP32-S3)
;   2. seeed_hr_sender   — Heart rate sensor module (Seeed XIAO ESP32S3)
; ============================================================================

; ============================================================================
; ENV 1: LilyGo T-Watch S3 — Main Watch
; ============================================================================
[env:lilygo_twatch_s3]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; --- Build Flags ---
build_flags =
    ; PSRAM (OPI)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; General
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; === T-Watch S3 Display (ST7789V3 240x240) via TFT_eSPI ===
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DTFT_BL=45
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

    ; === Load All Fonts ===
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; === XPowers AXP2101 PMU ===
    -DXPOWERS_CHIP_AXP2101=1

    ; === T-Watch S3 Build Target Flag ===
    -DLILYGO_TWATCH_S3=1

; --- Partition Scheme (16MB Flash) ---
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; --- Libraries ---
lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    lewisxhe/XPowersLib@^0.2.1

; --- Compile everything in src/ EXCEPT the sender and scanner ---
build_src_filter = +<*> -<seeed_sender_main.cpp> -<seeed_i2c_scanner.cpp> -<I2CScanner.cpp>

; --- Upload/Monitor ---
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder


; ============================================================================
; ENV 2: Seeed XIAO ESP32S3 — Heart Rate Sensor Module (UART + ESP-NOW)
; ============================================================================
[env:seeed_hr_sender]
platform = espressif32@^6.4.0
board = seeed_xiao_esp32s3
framework = arduino

; --- Build Flags ---
build_flags =
    ; PSRAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; General
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Partition Scheme (8MB Flash) ---
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; --- Only compile the sender file (exclude all watch code) ---
build_src_filter = +<seeed_sender_main.cpp>

; --- Libraries ---
lib_deps =
    oxullo/MAX30100lib@^1.2.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; --- Upload/Monitor ---
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder


; ============================================================================
; ENV 3: Seeed XIAO ESP32S3 — I2C Bus Scanner
; ============================================================================
[env:seeed_i2c_scanner]
platform = espressif32@^6.4.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_src_filter = +<seeed_i2c_scanner.cpp>

lib_deps =
    oxullo/MAX30100lib@^1.2.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

